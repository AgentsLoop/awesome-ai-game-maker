<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" style="display:block;width:100%;height:auto" role="img" data-motion="enabled" aria-labelledby="poster-title poster-desc">
  <title id="poster-title">Awesome AI Game Maker — animated parallax poster</title>
  <desc id="poster-desc">A robot game-maker stands in a neon workshop beside a floating holographic game diorama, a cluster of controllers, dice, and pixel blocks, and the title Awesome AI Game Maker. Seven independent depth layers. Move the pointer for parallax; the exported SVG autoplays and the preview adds pause and layer controls.</desc>
  <defs>
    <linearGradient id="white" x2="0" y2="1"><stop stop-color="#ffffff"/><stop offset=".55" stop-color="#eef4ff"/><stop offset="1" stop-color="#a8c4ff"/></linearGradient>
    <linearGradient id="titleColor"><stop stop-color="#00e9ff"/><stop offset=".28" stop-color="#39c7ff"/><stop offset=".52" stop-color="#9970ff"/><stop offset=".78" stop-color="#e16eff"/><stop offset="1" stop-color="#ffa6f2"/></linearGradient>
    <linearGradient id="chip" x2="1"><stop stop-color="#0a1734" stop-opacity=".82"/><stop offset="1" stop-color="#161038" stop-opacity=".78"/></linearGradient>
    <radialGradient id="haloCyan" cx=".5" cy=".5" r=".5"><stop stop-color="#31d8ff" stop-opacity=".5"/><stop offset="1" stop-color="#31d8ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="haloMagenta" cx=".5" cy=".5" r=".5"><stop stop-color="#ff5ce1" stop-opacity=".42"/><stop offset="1" stop-color="#ff5ce1" stop-opacity="0"/></radialGradient>
    <radialGradient id="vignette" cx=".5" cy=".48" r=".72"><stop offset=".55" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#01030f" stop-opacity=".72"/></radialGradient>
    <linearGradient id="bottomFade" x2="0" y2="1"><stop stop-color="#01030f" stop-opacity="0"/><stop offset="1" stop-color="#01030f" stop-opacity=".7"/></linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="6"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="textGlow" x="-12%" y="-40%" width="124%" height="180%"><feGaussianBlur stdDeviation="5"/><feComponentTransfer><feFuncA type="linear" slope=".6"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .depth { transform:translate(var(--dx,0px),var(--dy,0px)); }
    #scene-link { cursor:pointer; }
    .world { animation:world 22s ease-in-out infinite; }
    .grid { animation:gridPulse 5.5s ease-in-out infinite; }
    .diorama { animation:floatA 7s ease-in-out infinite; transform-origin:370px 650px; }
    .tools { animation:floatB 6s ease-in-out infinite; animation-delay:-2.4s; transform-origin:845px 712px; }
    .maker { animation:bob 5.4s ease-in-out infinite; transform-origin:1280px 869px; }
    .particle { animation:twinkle 3.4s ease-in-out infinite alternate; }
    .particle.p2 { animation-delay:-1.1s; }
    .particle.p3 { animation-delay:-2.2s; }
    .spark { animation:spark 2.6s linear infinite; }
    .spark.s2 { animation-delay:-.9s; }
    .spark.s3 { animation-delay:-1.7s; }
    .typeGlow { animation:typeGlow 6s ease-in-out infinite; }
    @keyframes world { 0%,100% { transform:translate(-3px,-2px) scale(1.008); } 50% { transform:translate(-8px,-5px) scale(1.012); } }
    @keyframes gridPulse { 0%,100% { opacity:.42; } 50% { opacity:.85; } }
    @keyframes floatA { 0%,100% { transform:translate(-4px,6px) rotate(-.7deg); } 50% { transform:translate(6px,-9px) rotate(.7deg); } }
    @keyframes floatB { 0%,100% { transform:translate(5px,5px) rotate(.5deg); } 50% { transform:translate(-7px,-8px) rotate(-.6deg); } }
    @keyframes bob { 0%,100% { transform:translate(-3px,4px) rotate(-.8deg); } 50% { transform:translate(4px,-10px) rotate(.8deg); } }
    @keyframes twinkle { from { opacity:.28; } to { opacity:.95; } }
    @keyframes spark { from { transform:translate(0,0); opacity:.9; } to { transform:translate(-46px,-96px); opacity:0; } }
    @keyframes typeGlow { 0%,100% { opacity:.5; } 50% { opacity:.85; } }
    [data-paused="true"] * { animation-play-state:paused !important; }
    @media (prefers-reduced-motion:reduce) { :root:not([data-motion="enabled"]) * { animation:none !important; } :root:not([data-motion="enabled"]) .depth { transform:none !important; } }
  </style>
  <a id="scene-link" href="https://github.com/AgentsLoop/awesome-ai-game-maker" aria-label="Open the Awesome AI Game Maker index on GitHub">
    <g id="layer-world" class="depth" data-depth="0.1" data-label="Workshop">
      <g class="world">
        <image href="{{bg}}" x="-36" y="-20" width="1672" height="941" preserveAspectRatio="xMidYMid slice"/>
      </g>
    </g>
    <g id="layer-grid" class="depth" data-depth="0.2" data-label="Hologram grid" pointer-events="none">
      <g class="grid">
        <ellipse cx="820" cy="742" rx="470" ry="86" fill="url(#haloCyan)"/>
        <path d="M420 700 1220 700M470 736 1170 736M540 772 1100 772M620 806 1020 806" stroke="#5ee6ff" stroke-opacity=".34" stroke-width="2" fill="none"/>
        <path d="M520 700 620 806M700 700 720 806M900 700 880 806M1080 700 980 806" stroke="#5ee6ff" stroke-opacity=".2" stroke-width="1.5" fill="none"/>
        <rect x="620" y="120" width="132" height="132" fill="none" stroke="#7ef0ff" stroke-opacity=".38" stroke-width="2"/>
        <path d="M620 120 686 54 818 54 752 120M752 120 818 54 818 186 752 252 752 120M620 252 686 186 818 186" fill="none" stroke="#7ef0ff" stroke-opacity=".3" stroke-width="2"/>
      </g>
    </g>
    <g id="layer-diorama" class="depth" data-depth="0.38" data-label="Game diorama">
      <g class="diorama">
        <ellipse cx="370" cy="820" rx="210" ry="34" fill="url(#haloCyan)" opacity=".55"/>
        <image href="{{diorama}}" x="120" y="470" width="500" height="361" preserveAspectRatio="xMidYMid meet"/>
      </g>
    </g>
    <g id="layer-tools" class="depth" data-depth="0.62" data-label="Maker tools">
      <g class="tools">
        <ellipse cx="845" cy="822" rx="200" ry="30" fill="url(#haloMagenta)" opacity=".5"/>
        <image href="{{tools}}" x="645" y="596" width="400" height="232" preserveAspectRatio="xMidYMid meet"/>
      </g>
    </g>
    <g id="layer-maker" class="depth" data-depth="0.85" data-label="Robot maker">
      <g class="maker">
        <ellipse cx="1280" cy="874" rx="176" ry="28" fill="url(#haloCyan)" opacity=".5"/>
        <image href="{{robot}}" x="1090" y="286" width="380" height="583" preserveAspectRatio="xMidYMid meet"/>
      </g>
    </g>
    <g id="layer-particles" class="depth" data-depth="1.05" data-label="Sparks" pointer-events="none">
      <g fill="#bff3ff">
        <circle class="particle" cx="300" cy="240" r="3.4"/>
        <circle class="particle p2" cx="700" cy="180" r="2.6"/>
        <circle class="particle p3" cx="980" cy="300" r="3"/>
        <circle class="particle" cx="1420" cy="180" r="2.4"/>
        <circle class="particle p2" cx="1520" cy="520" r="3.2"/>
        <circle class="particle p3" cx="520" cy="600" r="2.6"/>
        <circle class="particle" cx="880" cy="430" r="2.2"/>
        <circle class="particle p2" cx="200" cy="820" r="2.8"/>
      </g>
      <g stroke="#ff8ae8" stroke-width="2" fill="none">
        <path class="spark" d="M1150 700 l0 -18M1150 700 l0 18"/>
        <path class="spark s2" d="M420 300 l0 -16M420 300 l0 16"/>
        <path class="spark s3" d="M1330 620 l0 -14M1330 620 l0 14"/>
      </g>
      <g fill="#ffd166" opacity=".85">
        <circle class="particle p3" cx="1180" cy="250" r="2.2"/>
        <circle class="particle" cx="620" cy="880" r="2.4"/>
      </g>
    </g>
    <g id="layer-type" class="depth" data-depth="0.06" data-label="Typography" pointer-events="none">
      <g class="typeGlow">
        <text x="84" y="206" font-family="Arial,Helvetica,sans-serif" font-size="86" font-weight="700" letter-spacing="4" fill="url(#white)">AWESOME AI</text>
        <text x="84" y="300" font-family="Arial,Helvetica,sans-serif" font-size="86" font-weight="700" letter-spacing="4" fill="url(#titleColor)" filter="url(#textGlow)">GAME MAKER</text>
      </g>
      <text x="86" y="352" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#d7e5ff">16 tools · 111 verified example games</text>
      <text x="86" y="388" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#9fb6e6">prompt-to-playable studios · AI engines · world models</text>
      <g font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#d9ecff">
        <rect x="86" y="416" width="196" height="38" rx="13" fill="url(#chip)" stroke="#4fd8ff" stroke-opacity=".55"/>
        <text x="104" y="441">prompt-to-game</text>
        <rect x="296" y="416" width="148" height="38" rx="13" fill="url(#chip)" stroke="#4fd8ff" stroke-opacity=".55"/>
        <text x="314" y="441">AI engines</text>
        <rect x="458" y="416" width="188" height="38" rx="13" fill="url(#chip)" stroke="#c07bff" stroke-opacity=".55"/>
        <text x="476" y="441">assets &amp; publishing</text>
      </g>
      <rect x="70" y="840" width="500" height="40" rx="12" fill="#04091b" fill-opacity=".62"/>
      <text x="86" y="867" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#cfe0ff">github.com/AgentsLoop/awesome-ai-game-maker</text>
      <rect x="1352" y="840" width="182" height="40" rx="12" fill="#04091b" fill-opacity=".62"/>
      <text x="1514" y="867" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#c3d4f5">verified 2026-10-07</text>
    </g>
    <rect x="0" y="0" width="1600" height="900" fill="url(#vignette)" pointer-events="none"/>
    <rect x="0" y="700" width="1600" height="200" fill="url(#bottomFade)" pointer-events="none"/>
  </a>
  <script><![CDATA[
  (() => {
    const root = document.documentElement;
    const layers = [...root.querySelectorAll('.depth')];
    const reduced = matchMedia('(prefers-reduced-motion: reduce)');
    let targetX = 0, targetY = 0, x = 0, y = 0, raf = 0, enabled = true, strength = 1, paused = false, optedIn = root.dataset.motion === 'enabled';
    const motionBlocked = () => reduced.matches && !optedIn;
    function render() {
      raf = 0;
      if (motionBlocked() || paused || !enabled) return;
      x += (targetX - x) * .085;
      y += (targetY - y) * .085;
      layers.forEach(layer => {
        const d = Number(layer.dataset.depth);
        layer.style.setProperty('--dx', (x * d).toFixed(3) + 'px');
        layer.style.setProperty('--dy', (y * d).toFixed(3) + 'px');
      });
      if (Math.abs(targetX - x) + Math.abs(targetY - y) > .02) raf = requestAnimationFrame(render);
    }
    function schedule() { if (!raf && !paused && enabled && !motionBlocked()) raf = requestAnimationFrame(render); }
    function reset() { targetX = targetY = x = y = 0; layers.forEach(l => { l.style.removeProperty('--dx'); l.style.removeProperty('--dy'); }); }
    root.addEventListener('pointermove', e => {
      if (!enabled || paused || motionBlocked()) return;
      const r = root.getBoundingClientRect();
      targetX = ((e.clientX - r.left) / r.width - .5) * 46 * strength;
      targetY = ((e.clientY - r.top) / r.height - .5) * 30 * strength;
      schedule();
    });
    root.addEventListener('pointerleave', () => { targetX = targetY = 0; schedule(); });
    reduced.addEventListener('change', reset);
    window.sceneControls = {
      pause(value) { paused = Boolean(value); if (!paused && reduced.matches) { optedIn = true; root.dataset.motion = 'enabled'; } root.dataset.paused = String(paused); if (!paused) schedule(); },
      parallax(value) { enabled = Boolean(value); reset(); },
      strength(value) { strength = Math.max(0, Math.min(2, Number(value) || 0)); reset(); },
      layer(id, visible) { const layer = layers.find(l => l.id === id); if (layer) layer.style.display = visible ? '' : 'none'; },
      layers: layers.map(l => ({ id: l.id, label: l.dataset.label, depth: Number(l.dataset.depth) }))
    };
  })();
  ]]></script>
</svg>
