<!doctype html>
<html><head><meta charset="utf-8"><style>
body{margin:0;font:14px/1.4 Arial,sans-serif}
.half{height:450px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.half span{position:absolute;top:10px;left:14px;letter-spacing:.1em;font-size:12px;opacity:.7}
.dark{background:#0b0f19;color:#9fb2d8}
.light{background:#f4f6fb;color:#57678a}
img{max-width:100%;max-height:100%;object-fit:contain;display:block}
</style></head><body>
<div class="half dark"><span>DARK SURFACE / data-ink=light</span><img id="darkimg" src="poster-unslop.svg" alt="variant on dark"></div>
<div class="half light"><span>LIGHT SURFACE / data-ink=dark</span><img id="lightimg" src="poster-unslop-ink-dark.svg" alt="variant on light"></div>
</body></html>
