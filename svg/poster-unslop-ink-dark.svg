  </defs>
  <style>
    :root { --ink:#f4f7ff; --text:#e8eeff; --dim:#9fb2d8; --mono:#7f93bd; --accent:#37d6c3; --rule:#ffffff; }
    :root[data-ink="dark"] { --ink:#0c1120; --text:#151b2c; --dim:#57678a; --mono:#65769a; --accent:#0f9e8f; --rule:#0c1120; }
    .sans { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .mono { font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace; }
    .ink { fill: var(--ink); }
    .text { fill: var(--text); }
    .dim { fill: var(--dim); }
    .mono-c { fill: var(--mono); }
    .accent { fill: var(--accent); }
    .rule-c { stroke: var(--rule); }
    .depth { transform: translate(var(--dx,0px), var(--dy,0px)); }
    .rule { animation: rule 9s ease-in-out infinite alternate; }
    .sweep { animation: sweep 7.5s linear infinite; }
    .dot { animation: dot 4s ease-in-out infinite; }
    .row { animation: row 8s ease-in-out infinite; }
    .row:nth-child(2n) { animation-delay: -.6s; }
    .row:nth-child(3n) { animation-delay: -1.4s; }
    .row:nth-child(5n) { animation-delay: -2.2s; }
    @keyframes rule { from { opacity:.12; } to { opacity:.3; } }
    @keyframes sweep { 0% { transform:translateY(0); opacity:0; } 8% { opacity:.55; } 92% { opacity:.55; } 100% { transform:translateY(452px); opacity:0; } }
    @keyframes dot { 0%,100% { opacity:.45; } 50% { opacity:1; } }
    @keyframes row { 0%,100% { opacity:.62; } 50% { opacity:1; } }
    [data-paused="true"] * { animation-play-state: paused !important; }
    @media (prefers-reduced-motion:reduce) { :root:not([data-motion="enabled"]) * { animation:none !important; } :root:not([data-motion="enabled"]) .depth { transform:none !important; } }
  </style>
  <a href="https://github.com/AgentsLoop/awesome-ai-game-maker" aria-label="Open the Awesome AI Game Maker repository on GitHub">
