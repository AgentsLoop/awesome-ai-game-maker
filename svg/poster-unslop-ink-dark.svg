<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" style="display:block;width:100%;height:auto" role="img" data-motion="enabled" data-ink="dark" aria-labelledby="unslop-title unslop-desc">
  <title id="unslop-title">Awesome AI Game Maker — transparent index poster</title>
  <desc id="unslop-desc">A transparent-background, vector-only poster: the title Awesome AI Game Maker, a specification strip with 16 tools and 111 verified example games, the full tool list with categories, and the GitHub repository mark. Three depth layers drift with the pointer and one accent rule sweeps the sheet. Set data-ink="dark" on the root for dark ink on light surfaces.</desc>
